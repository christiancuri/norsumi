# norsumi production stack. Lives in /opt/norsumi on the VPS, run by deploy.sh.
#   Ingress: Cloudflare Tunnel (cloudflared) -> caddy:80. No host ports.
#   .env   : IMAGE_PREFIX, TUNNEL_TOKEN  (compose interpolation)
#   .tags  : API_TAG, WEB_TAG                    (written by deploy.sh)
#   api.env: API secrets (see api.env.example), mode 600
name: norsumi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/norsumi-api:${API_TAG:-latest}
    env_file: ./api.env
    restart: unless-stopped
    logging: *logging
    expose: ["3000"]
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX}/norsumi-web:${WEB_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    restart: unless-stopped
    logging: *logging
    depends_on:
      caddy: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:
